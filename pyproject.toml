[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-ceo-simulator"
version = "0.1.0"
description = "An offline MBA strategy simulation built with Python and PySide6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
startup-ceo-simulator = "startup_ceo.app:run"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
